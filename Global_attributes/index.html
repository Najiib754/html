<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Attributes Demo</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .box { border: 2px solid black; padding: 10px; margin: 10px 0; }
  </style>
</head>

<body id="mainBody" class="page" title="Main Page" dir="ltr">

  <h1 id="title" class="heading" title="Main Heading" tabindex="1">
    Global Attributes Example
  </h1>

  <p id="para1" class="text" lang="en" draggable="true" spellcheck="true">
    This paragraph is draggable and spellcheck is enabled.
  </p>

  <div id="container" class="box" contenteditable="true" title="Editable box">
    You can edit this text because of contenteditable.
  </div>

  <button id="btn1" class="btn" accesskey="b" onclick="alert('Clicked!')">
    Click Me (Alt + B)
  </button>

  <a id="link1" class="link" href="#" target="_blank" rel="noopener" translate="no">
    This link will not be translated
  </a>

  <img id="img1" class="image" src="https://via.placeholder.com/100"
       alt="Sample Image" hidden="false">

  <input id="input1" class="input" type="text"
         placeholder="Type here..." tabindex="2">

  <section id="section1" class="box" data-custom="example">
    Custom data attribute using data-*
  </section>

  <div id="hiddenDiv" class="box" hidden>
    This div is hidden using the hidden attribute.
  </div>

  <div id="focusBox" class="box" tabindex="0">
    You can focus this box using keyboard (Tab key).
  </div>

</body>
</html>
