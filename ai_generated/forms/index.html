<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Soldier Form</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI, Tahoma, sans-serif}

  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background: radial-gradient(circle at top,#111,#000);
    color:#fff;
  }

  .container{
    width:95%;max-width:950px;
    border-radius:20px;
    padding:30px;
    background: linear-gradient(145deg,#0d0d0d,#1a1a1a);
    box-shadow:0 0 40px rgba(0,0,0,0.9);
  }

  h1{
    text-align:center;
    margin-bottom:25px;
    font-size:28px;
    background:linear-gradient(90deg,#00f5a0,#00d9f5);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  fieldset{
    border:none;
    margin-bottom:20px;
    padding:20px;
    border-radius:15px;
    background:linear-gradient(145deg,#141414,#0f0f0f);
    box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
  }

  legend{font-weight:600;margin-bottom:10px;color:#00f5a0;}

  .row{display:flex;gap:15px;flex-wrap:wrap;}

  .form-group{flex:1 1 45%;display:flex;flex-direction:column;margin-bottom:15px;}

  label{font-size:13px;margin-bottom:6px;color:#bbb;}

  input,select,textarea{
    padding:12px;border-radius:10px;border:1px solid #222;background:#0a0a0a;color:#fff;
  }

  input:focus,select:focus,textarea:focus{
    border-color:#00f5a0;box-shadow:0 0 10px rgba(0,245,160,0.4);outline:none;
  }

  textarea{resize:none}

  .inline{display:flex;gap:15px;align-items:center;}

  .buttons{display:flex;gap:10px;}

  button{
    flex:1;padding:12px;border:none;border-radius:12px;font-weight:600;cursor:pointer;
    background:linear-gradient(90deg,#00f5a0,#00d9f5);color:#000;
  }

  button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,245,160,0.3);}

  @media(max-width:600px){.row{flex-direction:column}}
</style>
</head>

<body>

<div class="container">
  <h1>Soldier Registration System</h1>

  <form>

    <fieldset>
      <legend>Personal Info</legend>

      <div class="row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" value="Ahmed Hassan">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" value="ahmed.hassan@email.com">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" value="12345678">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="tel" value="+252612345678">
        </div>
      </div>

    </fieldset>

    <fieldset>
      <legend>Service Details</legend>

      <div class="row">
        <div class="form-group">
          <label>Rank</label>
          <select>
            <option>Private</option>
            <option selected>Sergeant</option>
            <option>Captain</option>
          </select>
        </div>

        <div class="form-group">
          <label>ID Number</label>
          <input type="number" value="789456">
        </div>
      </div>

      <div class="form-group">
        <label>Deployment Date</label>
        <input type="date" value="2026-04-30">
      </div>

    </fieldset>

    <fieldset>
      <legend>Equipment</legend>

      <div class="form-group">
        <label>Weapon Type</label>
        <select>
          <option selected>Rifle</option>
          <option>Pistol</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload File</label>
        <input type="file">
      </div>

      <div class="form-group">
        <label>Condition</label>
        <input type="range" value="70">
      </div>

    </fieldset>

    <fieldset>
      <legend>Other</legend>

      <div class="form-group">
        <label>Notes</label>
        <textarea rows="3">Standard equipment assigned and operational.</textarea>
      </div>

      <div class="inline">
        <input type="checkbox" checked> <label>Agree Terms</label>
      </div>

      <div class="inline">
        <input type="radio" name="r" checked> Yes
        <input type="radio" name="r"> No
      </div>

    </fieldset>

    <div class="buttons">
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </div>

  </form>
</div>

</body>
</html>
